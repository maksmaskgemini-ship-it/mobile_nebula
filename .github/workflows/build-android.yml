name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: nebula/go.sum

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter 3.38.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'

      - name: Install NDK 27.0.12077973
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"

      - name: Install gomobile and prepare env
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cp env.sh.example env.sh

      - name: Create libs directory
        run: mkdir -p android/app/src/main/libs

      - name: Auto-patch Flutter source (fix onReorderItem)
        run: |
          find lib -name "*.dart" -exec sed -i 's/onReorderItem:/onReorder:/g' {} +
          python3 -c "
          import os
          for root, _, files in os.walk('lib'):
              for file in files:
                  if file.endswith('.dart'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      if 'onReorder: (oldI, newI) async {' in content:
                          content = content.replace('onReorder: (oldI, newI) async {', 'onReorder: (oldI, newI) async {\n      if (oldI < newI) newI -= 1;')
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
          "

      # ⬇️ ГЕНЕРАЦИЯ НЕДОСТАЮЩИХ ФАЙЛОВ (DART И KOTLIN) ⬇️
      - name: Generate Physical Bridge Files
        run: |
          mkdir -p lib/services
          mkdir -p android/app/src/main/kotlin/com/definednetworking/mobile_nebula

          cat << 'EOF' > lib/services/physical_bridge.dart
          import 'dart:async';
          import 'package:flutter/services.dart';

          class PhysicalBridge {
            static const _methods = MethodChannel('physical_bridge/methods');
            static const _sensors = EventChannel('physical_bridge/sensors');
            final _sensorController = StreamController<Map<String, dynamic>>.broadcast();
            Stream<Map<String, dynamic>> get sensors => _sensorController.stream;
            StreamSubscription? _sensorSub;

            void startSensors() {
              _sensorSub ??= _sensors.receiveBroadcastStream().listen(
                (data) => _sensorController.add(Map<String, dynamic>.from(data)),
                onError: (e) => print('Sensor error: $e'),
              );
            }
            Future<void> vibrate(int ms) async => _methods.invokeMethod('vibrate', {'ms': ms});
            Future<void> beep({int duration = 200}) async => _methods.invokeMethod('beep', {'duration': duration});
          }
          EOF

          cat << 'EOF' > android/app/src/main/kotlin/com/definednetworking/mobile_nebula/SensorBridge.kt
          package com.definednetworking.mobile_nebula
          import android.content.Context
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Vibrator
          import android.os.VibrationEffect
          import android.os.Build
          import android.media.AudioManager
          import android.media.ToneGenerator
          import io.flutter.plugin.common.MethodChannel
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.BinaryMessenger

          class SensorBridge(private val context: Context, messenger: BinaryMessenger) : SensorEventListener, EventChannel.StreamHandler {
              private val sensorManager = context.getSystemService(Context.SENSOR_SERVICE) as SensorManager
              private var eventSink: EventChannel.EventSink? = null
              private val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
              private val toneGenerator = ToneGenerator(AudioManager.STREAM_NOTIFICATION, 100)

              init {
                  val methodChannel = MethodChannel(messenger, "physical_bridge/methods")
                  methodChannel.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "vibrate" -> {
                              val ms = call.argument<Int>("ms") ?: 500
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  vibrator.vibrate(VibrationEffect.createOneShot(ms.toLong(), VibrationEffect.DEFAULT_AMPLITUDE))
                              } else {
                                  @Suppress("DEPRECATION")
                                  vibrator.vibrate(ms.toLong())
                              }
                              result.success(true)
                          }
                          "beep" -> {
                              toneGenerator.startTone(ToneGenerator.TONE_CDMA_PIP, call.argument<Int>("duration") ?: 200)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
                  val eventChannel = EventChannel(messenger, "physical_bridge/sensors")
                  eventChannel.setStreamHandler(this)
              }

              override fun onListen(arguments: Any?, events: EventChannel.EventSink?) {
                  eventSink = events
                  sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
              }

              override fun onCancel(arguments: Any?) {
                  sensorManager.unregisterListener(this)
                  eventSink = null
              }

              override fun onSensorChanged(event: SensorEvent) {
                  if (event.sensor.type == Sensor.TYPE_ACCELEROMETER) {
                      eventSink?.success(mapOf("type" to "accel", "x" to event.values[0], "y" to event.values[1], "z" to event.values[2]))
                  }
              }
              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
          }
          EOF

          cat << 'EOF' > android/app/src/main/kotlin/com/definednetworking/mobile_nebula/MainActivity.kt
          package com.definednetworking.mobile_nebula
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine

          class MainActivity : FlutterActivity() {
              private var sensorBridge: SensorBridge? = null
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  sensorBridge = SensorBridge(applicationContext, flutterEngine.dartExecutor.binaryMessenger)
              }
          }
          EOF

      - name: Inject AI Agent and Sensors
        run: |
          python3 -c "
          import os
          with open('pubspec.yaml', 'r', encoding='utf-8') as f: pubspec = f.read()
          if 'url_launcher' not in pubspec:
              pubspec = pubspec.replace('dependencies:', 'dependencies:\n  url_launcher: ^6.2.5\n  web_socket_channel: ^2.4.0')
              with open('pubspec.yaml', 'w', encoding='utf-8') as f: f.write(pubspec)
          
          p = 'lib/screens/main_screen.dart'
          if os.path.exists(p):
              with open(p, 'r', encoding='utf-8') as f: c = f.read()
              if 'PhysicalBridge' not in c:
                  c = c.replace(\"import 'package:flutter/material.dart';\", \"import 'package:flutter/material.dart';\nimport 'package:web_socket_channel/web_socket_channel.dart';\nimport '../services/physical_bridge.dart';\nimport 'dart:convert';\nimport 'package:url_launcher/url_launcher.dart';\")
                  
                  init_code = '''
                  final bridge = PhysicalBridge();
                  WebSocketChannel? channel;
                  @override
                  void initState() {
                    super.initState();
                    bridge.startSensors();
                    channel = WebSocketChannel.connect(Uri.parse('ws://100.73.128.2:8000/api/physical/ws/phone_node'));
                    bridge.sensors.listen((data) {
                      channel?.sink.add(jsonEncode({'type': 'sensors', 'data': [data]}));
                    });
                    channel?.stream.listen((msg) {
                      final d = jsonDecode(msg);
                      if (d['type'] == 'action' && d['action'] == 'vibrate') {
                        bridge.vibrate(d['params']?['ms'] ?? 500);
                      }
                    });
                  }
                  '''
                  if 'void initState()' in c:
                      c = c.replace('void initState() {', 'void initState() {\n' + init_code)
                  else:
                      c = c.replace('class _MainScreenState extends State<MainScreen> {', 'class _MainScreenState extends State<MainScreen> {\n' + init_code)
                  
                  with open(p, 'w', encoding='utf-8') as f: f.write(c)
          "

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate native artifacts
        run: |
          chmod +x gen-artifacts.sh
          ./gen-artifacts.sh android

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release build-${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-debug.apk
          draft: false
          prerelease: false
