name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: nebula/go.sum

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ⬇️ ИЗМЕНЕНИЕ ЗДЕСЬ: Flutter 3.38.9 даёт Dart 3.10.8
      - name: Install Flutter 3.38.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'

      - name: Install NDK 27.0.12077973
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"

      - name: Install gomobile and prepare env
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cp env.sh.example env.sh

      - name: Create libs directory
        run: mkdir -p android/app/src/main/libs

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate native artifacts
        run: |
          chmod +x gen-artifacts.sh
          ./gen-artifacts.sh android

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-nebula-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
